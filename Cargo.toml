# Every rule in this repository is a stiles plugin: a cdylib that stiles
# builds at check time and loads into its own process. Rust has no stable ABI
# of its own, so stiles lays every type that crosses that boundary out with
# stabby, whose layouts hold under any compiler. A plugin is coherent with the
# stiles that loads it when both lay those types out the same way, which
# stiles checks with a protocol version and two fingerprints. The pin below is
# a commit so that the rules build against a known boundary, and a mismatch
# refuses the plugin with an error. The toolchain this repository pins is its own choice.
[workspace]
# `lints/*` are the rules themselves, each a cdylib stiles loads.
# `crates/*` hold what more than one rule needs, as ordinary rlibs that
# produce no library for stiles to find.
members = ["crates/*", "lints/*"]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/stiles-aonyx-rules.git"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# `lint.matches-macro` asks for a `match` whose arms yield `true` or `false`,
# and this lint asks for `matches!` in its place when the last arm is a
# wildcard. The two cannot both pass, and the rule is the convention here.
match_like_matches_macro = "allow"

[workspace.dependencies]
# A rule's own types take their builders from bon, as stiles's conventions
# ask. No bon type crosses the plugin boundary, so the pin does not cover it.
bon = "3"
boundary = { path = "crates/boundary" }
doc_comment = { path = "crates/doc_comment" }
proptest = "1"
# `DecoratedNode::raw()` returns a `tree_sitter::Node`, which some rules name
# directly. The version matches stiles's own so that the plugin and the host
# agree on the type that crosses the boundary.
tree-sitter = "0.27"
# One pin for every rule. Stiles is not published, so these are git
# dependencies. The commit decides which stiles source produced a plugin,
# and a tag can be moved, so the pin is a commit and the release beside it
# says which one. Renovate reads the pair through a custom manager and
# moves both, the way it moves a pinned action.
stiles-plugin = { git = "https://github.com/aonyx-ai/stiles.git", rev = "da1bcf8bd32c12803dd9ead45cd24dc018b80125" }
stiles-rust = { git = "https://github.com/aonyx-ai/stiles.git", rev = "da1bcf8bd32c12803dd9ead45cd24dc018b80125", default-features = false }
stiles-testing = { git = "https://github.com/aonyx-ai/stiles.git", rev = "da1bcf8bd32c12803dd9ead45cd24dc018b80125" }
stiles-types = { git = "https://github.com/aonyx-ai/stiles.git", rev = "da1bcf8bd32c12803dd9ead45cd24dc018b80125" }
stiles-typescript = { git = "https://github.com/aonyx-ai/stiles.git", rev = "da1bcf8bd32c12803dd9ead45cd24dc018b80125", default-features = false }
