# Every rule in this repository is a whisker plugin: a cdylib that whisker
# builds at check time and loads into its own process. Rust has no stable ABI
# of its own, so whisker lays every type that crosses that boundary out with
# stabby, whose layouts hold under any compiler. A plugin is coherent with the
# whisker that loads it when both lay those types out the same way, which
# whisker checks with a protocol version and two fingerprints. The pin below is
# a commit so that the rules build against a known boundary, and a mismatch
# refuses the plugin with an error. The toolchain this repository pins is its own choice.
[workspace]
# `lints/*` are the rules themselves, each a cdylib whisker loads.
# `crates/*` hold what more than one rule needs, as ordinary rlibs that
# produce no library for whisker to find.
members = ["crates/*", "lints/*"]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/whisker-aonyx-rules.git"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
boundary = { path = "crates/boundary" }
jsdoc = { path = "crates/jsdoc" }
proptest = "1"
# `DecoratedNode::raw()` returns a `tree_sitter::Node`, which some rules name
# directly. The version matches whisker's own so that the plugin and the host
# agree on the type that crosses the boundary.
tree-sitter = "0.27"
# One pin for every rule. Whisker is not published, so these are git
# dependencies. The commit decides which whisker source produced a plugin,
# and a tag can be moved, so the pin is a commit and the release beside it
# says which one. Renovate reads the pair through a custom manager and
# moves both, the way it moves a pinned action.
whisker-plugin = { git = "https://github.com/aonyx-ai/whisker.git", rev = "32e387e9d9d19417d34ded70059aab73897ebe01" }
whisker-rust = { git = "https://github.com/aonyx-ai/whisker.git", rev = "32e387e9d9d19417d34ded70059aab73897ebe01", default-features = false }
whisker-testing = { git = "https://github.com/aonyx-ai/whisker.git", rev = "32e387e9d9d19417d34ded70059aab73897ebe01" }
whisker-types = { git = "https://github.com/aonyx-ai/whisker.git", rev = "32e387e9d9d19417d34ded70059aab73897ebe01" }
whisker-typescript = { git = "https://github.com/aonyx-ai/whisker.git", rev = "32e387e9d9d19417d34ded70059aab73897ebe01", default-features = false }
