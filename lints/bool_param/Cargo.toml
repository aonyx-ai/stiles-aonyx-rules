# A lint is its own cargo package, built as a cdylib and loaded by stiles at
# check time. Every rule here is built against one pinned stiles release,
# named once in the workspace manifest, because the handshake compares the
# stiles a plugin was compiled against with the stiles loading it.
[package]
name = "bool_param"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The provider feature stays off: a lint needs the generated trait and the
# decoration types, not the rust-analyzer stack that produces decorations.
# The exported declaration is a `no_mangle` static, so two rules linked into
# one binary would collide. The cdylib stiles loads keeps it; a rule used as
# an ordinary rlib dependency, as stiles-rust's provider tests do, turns it
# off.
[features]
default = ["plugin"]
plugin = []

[dependencies]
stiles-plugin = { workspace = true }
# Both rules ask one question about a signature and must answer it alike.
boundary = { workspace = true }
stiles-rust = { workspace = true }
stiles-types = { workspace = true }

[dev-dependencies]
stiles-testing = { workspace = true }

[lints]
workspace = true
