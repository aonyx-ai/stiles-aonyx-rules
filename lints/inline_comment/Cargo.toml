# A lint is its own cargo package, built as a cdylib and loaded by whisker at
# check time. Every rule here is built against one pinned whisker revision,
# named once in the workspace manifest, because the handshake compares the
# whisker a plugin was compiled against with the whisker loading it.
[package]
name = "inline_comment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The provider feature stays off: a lint needs the generated trait and the
# decoration types, not the rust-analyzer stack that produces decorations.
# The exported declaration is a `no_mangle` static, so two rules linked into
# one binary would collide. The cdylib whisker loads keeps it; a rule used as
# an ordinary rlib dependency, as whisker-rust's provider tests do, turns it
# off.
[features]
default = ["plugin"]
plugin = []

[dependencies]
whisker-plugin = { workspace = true }
# `DecoratedNode::raw()` returns a `tree_sitter::Node`, which the rule names
# directly. The version matches the workspace so the plugin and the host agree
# on the type that crosses the boundary.
tree-sitter = { workspace = true }
whisker-rust = { workspace = true }
whisker-types = { workspace = true }

[dev-dependencies]
whisker-testing = { workspace = true }

[lints]
workspace = true
