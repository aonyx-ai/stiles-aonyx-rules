---
name: Reference

# A Cloudflare Worker serves the reference page of the rules from the assets
# that `site/wrangler.jsonc` selects. A release deploys the page, so it
# describes the rules that a project downloads. A prerelease does not deploy
# it. Running this workflow by hand on main deploys too, which is how the page
# goes up between releases. CI builds the page on every pull request.
"on":
  release:
    types: [released]
  workflow_dispatch:

permissions: {}

# A deployment that started always completes, and the next one waits for it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the reference page
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'release'
      || github.ref == 'refs/heads/main'

    permissions:
      contents: read

    environment:
      name: production
      url: https://stiles-rules.aonyx.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      # This job keeps no Cargo cache, like the release of the binaries. A
      # pull request can write to one, and this job publishes what it builds.
      - name: Download the pinned stiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: just fetch-stiles x86_64-unknown-linux-gnu

      - name: Build the reference page
        run: just reference target/stiles/stiles

      # The account of the Worker comes from a secret rather than from the
      # committed configuration, because this repository is public.
      - name: Deploy the reference page
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
