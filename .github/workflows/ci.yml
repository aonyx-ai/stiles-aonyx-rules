---
name: Continuous Integration

"on":
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      NEXTEST_PROFILE: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Just and nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-nextest

      - name: Cache Cargo downloads and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: just format-check

      - name: Lint
        run: just lint

      - name: Test
        run: just test

  dogfood:
    name: Check this repository with its own rules
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rules
          persist-credentials: false

      - name: Install Just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # The pin lives in one place, the workspace manifest, so this job reads
      # it rather than repeating it. A stiles built from any other revision
      # would be refused by the handshake, which is the point of the job: it
      # is what tells us the pair still fits before a project finds out.
      - name: Read the pinned stiles revision
        id: pin
        run: echo "rev=$(just --justfile rules/justfile --working-directory rules pin)" >> "$GITHUB_OUTPUT"

      - name: Checkout stiles at the pinned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aonyx-ai/stiles
          ref: ${{ steps.pin.outputs.rev }}
          path: stiles
          persist-credentials: false

      - name: Cache Cargo downloads and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            stiles/target
            rules/target
          key: dogfood-${{ runner.os }}-${{ steps.pin.outputs.rev }}-${{ hashFiles('rules/Cargo.lock') }}
          restore-keys: dogfood-${{ runner.os }}-${{ steps.pin.outputs.rev }}-

      - name: Build stiles
        working-directory: stiles
        run: cargo build --release -p stiles

      # Through the recipe, so that this job runs what a developer runs.
      - name: Check the rules with themselves
        working-directory: rules
        run: just check-self ../stiles/target/release/stiles

  success:
    name: All checks succeeded
    runs-on: ubuntu-latest

    permissions: {}

    needs: [checks, dogfood]
    if: always()

    steps:
      - name: Check if all checks succeeded
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
