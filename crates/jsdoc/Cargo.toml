# Three rules read the prose of a TypeScript doc comment, and they have to
# agree on where it is. The reading lives here rather than in each rule,
# because a copy that drifts makes one rule report a parameter's syntax that
# another skips.
#
# This crate is an rlib and exports no plugin declaration, so the build
# produces no dynamic library for whisker to load.
[package]
name = "jsdoc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
