# Each rule's tests check the negative example and the fix in the docs of
# its pass, and this crate reads that pair from the rule's source. A rule
# takes it as a dev-dependency only, so no plugin links it.
[package]
name = "example_pair"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The fix check applies the fixes of a rule in rounds, with the same
# stiles-core code that `stiles check --fix` runs.
[dependencies]
stiles-core = { workspace = true }
stiles-types = { workspace = true }

[lints]
workspace = true
