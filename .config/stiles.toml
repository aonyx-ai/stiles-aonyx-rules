# Stiles reads this file when `stiles check` runs against this repository.
# The first entry builds every rule in this repository, because each one is
# a workspace member, and checks this repository with itself. A rule that
# would fire on its own source is a rule worth reconsidering.
[[lints]]
path = "."

# The rules for crates of rules check that each pass here documents its rule,
# names its options, and declares its rule ids. The pin builds against the
# same stiles release as the rules here. Bumping it is how this repository
# adopts a new or changed rule from there.
[[lints]]
git = "https://github.com/aonyx-ai/stiles-lint-rules"
rev = "f8019a38184e8df399740f826e77e92d39dee4fe"
